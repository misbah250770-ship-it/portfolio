<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | Misbah Huddin</title>

    <style>

        /* ==================================================
           1. PENGATURAN WARNA
        ================================================== */

        :root {
            --background: #f4f5f7;
            --card: #ffffff;
            --text: #151515;
            --text-light: #666666;
            --border: #dddddd;
            --accent: #6c63ff;
        }

        body.dark {
            --background: #0d0d0f;
            --card: #17171a;
            --text: #ffffff;
            --text-light: #aaaaaa;
            --border: #2c2c30;
            --accent: #8b83ff;
        }


        /* ==================================================
           2. DASAR WEBSITE
        ================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);

            transition:
                background 0.4s ease,
                color 0.4s ease;

            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            width: 90%;
            max-width: 1150px;
            margin: auto;
        }


        /* ==================================================
           3. NAVBAR
        ================================================== */

        .navbar {
            position: fixed;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            width: 90%;
            max-width: 1100px;

            padding: 15px 22px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 18px;

            z-index: 1000;

            box-shadow: 0 10px 40px rgba(0,0,0,0.08);

            transition: 0.4s;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-menu {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-menu a {
            font-size: 14px;
            color: var(--text-light);

            transition: 0.3s;
        }

        .nav-menu a:hover {
            color: var(--accent);
        }


        /* Tombol Dark Mode */

        .theme-button {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            border: 1px solid var(--border);

            background: var(--background);

            color: var(--text);

            cursor: pointer;

            font-size: 18px;

            transition: 0.3s;
        }

        .theme-button:hover {
            transform: scale(1.1);
        }


        /* ==================================================
           4. HERO / HOME
        ================================================== */

        .hero {
            min-height: 100vh;

            display: grid;

            grid-template-columns: 1.2fr 0.8fr;

            align-items: center;

            gap: 70px;

            padding-top: 120px;
        }

        .hero-small {
            color: var(--accent);

            font-size: 14px;

            letter-spacing: 3px;

            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: 75px;

            line-height: 1;

            letter-spacing: -4px;

            margin-bottom: 20px;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero h2 {
            font-size: 23px;

            font-weight: normal;

            color: var(--text-light);

            margin-bottom: 5px;
        }

        .university {
            color: var(--text-light);

            font-size: 16px;

            margin-bottom: 20px;
        }

        .hero-description {
            max-width: 600px;

            color: var(--text-light);

            font-size: 17px;

            margin-bottom: 30px;
        }


        /* ==================================================
           5. TOMBOL
        ================================================== */

        .buttons {
            display: flex;

            gap: 12px;

            flex-wrap: wrap;
        }

        .button {
            display: inline-block;

            padding: 13px 22px;

            border-radius: 12px;

            border: 1px solid var(--border);

            transition: 0.3s;

            cursor: pointer;
        }

        .button-main {
            background: var(--accent);

            color: white;

            border-color: var(--accent);
        }

        .button:hover {
            transform: translateY(-4px);
        }


        /* ==================================================
           6. FOTO PROFIL
        ================================================== */

        .photo-area {
            display: flex;

            justify-content: center;
        }

        .photo-box {
            width: 360px;
            height: 430px;

            padding: 10px;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 30px;

            box-shadow: 0 25px 70px rgba(0,0,0,0.12);

            transform: rotate(2deg);

            transition: 0.5s;
        }

        .photo-box:hover {
            transform: rotate(0deg) translateY(-10px);
        }

        .photo-box img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 22px;
        }


        /* ==================================================
           7. SECTION
        ================================================== */

        section {
            padding: 120px 0;
        }

        .section-number {
            color: var(--accent);

            font-size: 13px;

            letter-spacing: 3px;

            margin-bottom: 10px;
        }

        .section-title {
            font-size: 55px;

            letter-spacing: -3px;

            margin-bottom: 50px;
        }


        /* ==================================================
           8. ABOUT
        ================================================== */

        .about {
            display: grid;

            grid-template-columns: 0.8fr 1.2fr;

            gap: 70px;
        }

        .about-big {
            font-size: 30px;

            line-height: 1.4;
        }

        .about-text {
            color: var(--text-light);

            font-size: 17px;

            line-height: 1.9;
        }


        /* ==================================================
           9. SKILLS
        ================================================== */

        .skills {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;
        }

        .skill-card {
            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 20px;

            padding: 28px;

            transition: 0.4s;
        }

        .skill-card:hover {
            transform: translateY(-7px);

            border-color: var(--accent);
        }

        .skill-card h3 {
            font-size: 21px;

            margin-bottom: 10px;
        }

        .skill-card p {
            color: var(--text-light);

            font-size: 14px;

            margin-bottom: 20px;
        }

        .skill-bar {
            width: 100%;

            height: 6px;

            background: var(--background);

            border-radius: 20px;

            overflow: hidden;
        }

        .skill-progress {
            height: 100%;

            background: var(--accent);

            border-radius: 20px;
        }


        /* ==================================================
           10. CURRENTLY LEARNING
        ================================================== */

        .learning-box {
            margin-top: 25px;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 20px;

            padding: 30px;
        }

        .learning-box h3 {
            margin-bottom: 20px;
        }

        .learning-list {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;
        }

        .learning-item {
            padding: 9px 15px;

            border-radius: 30px;

            background: var(--background);

            color: var(--text-light);

            font-size: 13px;
        }


        /* ==================================================
           11. PROJECTS
        ================================================== */

        .projects {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 20px;
        }

        .project-card {
            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 24px;

            padding: 30px;

            transition: 0.4s;
        }

        .project-card:hover {
            transform: translateY(-7px);

            border-color: var(--accent);
        }
